[project]
name = "kohai"
version = "0.1.0"
description = "Your tiny model's senpai is a big one. Train a small local LLM into a specialist, with any AI as the teacher."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["llm", "distillation", "fine-tuning", "tui", "small-language-models", "kohai"]
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "psutil>=5.9",
    "huggingface_hub>=0.24",
]

[project.scripts]
kohai = "kohai.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kohai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
