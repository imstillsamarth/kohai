[project]
name = "kohai"
version = "0.1.0"
description = "Your tiny model's senpai is a big one. Train a small local LLM into a specialist, with any AI as the teacher."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["llm", "distillation", "fine-tuning", "tui", "small-language-models", "kohai"]
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "psutil>=5.9",
    "huggingface_hub>=0.24",
    "regex>=2024.0",
]

[project.optional-dependencies]
# Everything needed to actually train: `uv sync --extra train` / `pip install kohai[train]`
train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; sys_platform != 'darwin'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
kohai = "kohai.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kohai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
